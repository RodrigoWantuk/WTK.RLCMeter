name: W25Q64 bad JEDEC
version: 1
author: WTK.RLCMeter
steps:
  - wait-serial: 'boot_state: SAFE_BOOT'
  - wait-serial: 'spi2: OK'
  - wait-serial: 'w25q: UNSUPPORTED_DEVICE'
  - wait-serial: 'display: READY'
  - wait-serial: 'fallback_ui: FLASH_ERROR_DRAWN'
  - delay: 1500ms
  - expect-pin:
      part-id: mcu
      pin: A8
      value: 0
  - expect-pin:
      part-id: mcu
      pin: A11
      value: 0
  - expect-pin:
      part-id: mcu
      pin: B8
      value: 0
  - expect-pin:
      part-id: mcu
      pin: B9
      value: 0
  - expect-pin:
      part-id: mcu
      pin: B1
      value: 0
  - expect-pin:
      part-id: mcu
      pin: A12
      value: 1
  - expect-pin:
      part-id: mcu
      pin: B12
      value: 1
