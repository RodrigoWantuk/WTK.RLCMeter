name: Boot safe GPIO defaults
version: 1
author: WTK.RLCMeter
steps:
  - wait-serial: 'WTK.RLCMeter'
  - wait-serial: 'boot_state: SAFE_BOOT'
  - wait-serial: 'swd: PRESERVED'
  - delay: 1800ms
  - expect-pin:
      part-id: mcu
      pin: PA8
      expected: 0
  - expect-pin:
      part-id: mcu
      pin: PA11
      expected: 0
  - expect-pin:
      part-id: mcu
      pin: PB8
      expected: 0
  - expect-pin:
      part-id: mcu
      pin: PB9
      expected: 0
  - expect-pin:
      part-id: mcu
      pin: PB1
      expected: 0
  - expect-pin:
      part-id: mcu
      pin: PA12
      expected: 1
  - expect-pin:
      part-id: mcu
      pin: PB12
      expected: 1
