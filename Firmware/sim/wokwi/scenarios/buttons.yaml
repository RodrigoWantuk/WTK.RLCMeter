name: Button diagnostics
version: 1
author: WTK.RLCMeter
steps:
  - wait-serial: 'boot_state: SAFE_BOOT'
  - wait-serial: 'spi2: OK'
  - wait-serial: 'w25q:'
  - set-control:
      part-id: btn-up
      control: pressed
      value: 1
  - wait-serial: 'button: UP PRESS'
  - set-control:
      part-id: btn-up
      control: pressed
      value: 0
  - wait-serial: 'button: UP RELEASE'
  - set-control:
      part-id: btn-down
      control: pressed
      value: 1
  - wait-serial: 'button: DOWN PRESS'
  - set-control:
      part-id: btn-down
      control: pressed
      value: 0
  - wait-serial: 'button: DOWN RELEASE'
  - set-control:
      part-id: btn-ok
      control: pressed
      value: 1
  - wait-serial: 'button: OK PRESS'
  - wait-serial: 'button: OK LONG_PRESS'
  - set-control:
      part-id: btn-ok
      control: pressed
      value: 0
  - wait-serial: 'button: OK RELEASE'
