name: Flash forensics

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          submodules: recursive
      - name: Install host and ARM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3 python3-pil
          arm-none-eabi-gcc --version
      - name: Hardware source/export and review reconciliation
        working-directory: candidate
        run: |
          python3 PCB/tools/audit_rev1.py --check
          python3 -m unittest discover -s PCB/tests -v
      - name: Host and Python regression
        working-directory: candidate/Firmware
        run: |
          for preset in host-debug host-release; do
            for curves in OFF ON; do
              for factory in OFF ON; do
                build="build/$preset-curves-$curves-factory-$factory"
                cmake --preset "$preset" -G Ninja -B "$build" -DWTK_ENABLE_SUPPLEMENTARY_CURVES="$curves" -DWTK_PRODUCT_FACTORY_PROVISIONED="$factory"
                cmake --build "$build" --parallel 2
                ctest --test-dir "$build" --output-on-failure
                WTK_CAPTURE_BRIDGE="$PWD/$build/tests/wtk_pc_cal_capture_bridge" python3 -m unittest discover -s tests/tools -v
              done
            done
          done
      - name: Build base and candidate with the same installed compiler
        shell: bash
        run: |
          set -euo pipefail
          for tree in baseline candidate; do
            for preset in stm32-debug stm32-release stm32-bringup; do
              mkdir -p "$tree/Firmware/build"
              cmake --preset "$preset" -S "$tree/Firmware" -DWTK_FLASH_FORENSICS=ON
              cmake --build "$tree/Firmware/build/$preset" --parallel 2 2>&1 | tee "$tree/Firmware/build/$preset-build.log"
            done
          done
      - name: Build and capture PRODUCT with supplementary curves enabled
        working-directory: candidate/Firmware
        run: |
          cmake --preset stm32-release -B build/stm32-release-curves-on \
            -DWTK_ENABLE_SUPPLEMENTARY_CURVES=ON -DWTK_FLASH_FORENSICS=ON
          cmake --build build/stm32-release-curves-on --parallel 2
          python3 tools/collect_flash_evidence.py build/stm32-release-curves-on \
            --profile stm32-release-curves-on --git-sha "$(git rev-parse HEAD)"
      - name: Capture per-commit evidence and regression deltas
        # The development calibration image has no baseline preset before A06.2a.
        shell: bash
        run: |
          set -euo pipefail
          for preset in stm32-debug stm32-release stm32-bringup; do
            python3 candidate/Firmware/tools/collect_flash_evidence.py "baseline/Firmware/build/$preset" \
              --profile "$preset-base" --git-sha "$(git -C baseline rev-parse HEAD)"
            python3 candidate/Firmware/tools/collect_flash_evidence.py "candidate/Firmware/build/$preset" \
              --profile "$preset" --git-sha "$(git -C candidate rev-parse HEAD)" \
              --baseline "baseline/Firmware/build/$preset/forensics/attribution.json"
          done
      - name: Build bounded calibration service OFF and ON
        working-directory: candidate/Firmware
        run: |
          for curves in OFF ON; do
            build="build/stm32-bringup-cal-$curves"
            cmake --preset stm32-bringup-cal -B "$build" \
              -DWTK_ENABLE_SUPPLEMENTARY_CURVES="$curves" -DWTK_FLASH_FORENSICS=ON
            cmake --build "$build" --parallel 2
            python3 tools/collect_flash_evidence.py "$build" \
              --profile "stm32-bringup-cal-$curves" --git-sha "$(git rev-parse HEAD)"
          done
      - name: Build experimental factory PRODUCT Debug/Release OFF/ON
        working-directory: candidate/Firmware
        run: |
          for preset in stm32-factory-debug stm32-factory-release; do
            for curves in OFF ON; do
              build="build/$preset-$curves"
              cmake --preset "$preset" -B "$build" -DWTK_ENABLE_SUPPLEMENTARY_CURVES="$curves" -DWTK_FLASH_FORENSICS=ON
              cmake --build "$build" --parallel 2
              python3 tools/collect_flash_evidence.py "$build" --profile "$preset-$curves" --git-sha "$(git rev-parse HEAD)"
            done
          done
      - name: Retain evidence even on a build-gate failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-forensics-${{ github.sha }}
          retention-days: 30
          path: |
            baseline/Firmware/build/**/forensics/
            candidate/Firmware/build/**/forensics/
            baseline/Firmware/build/**/*.map
            candidate/Firmware/build/**/*.map
            baseline/Firmware/build/**/*.size.json
            candidate/Firmware/build/**/*.size.json
            baseline/Firmware/build/**/*.elf
            candidate/Firmware/build/**/*.elf
            baseline/Firmware/build/**/*.bin
            candidate/Firmware/build/**/*.bin
            candidate/Firmware/build/**/*.su
            candidate/Firmware/build/*-build.log
            baseline/Firmware/build/*-build.log
