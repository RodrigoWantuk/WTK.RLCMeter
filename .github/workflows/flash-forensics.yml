name: Flash forensics

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          submodules: recursive
      - name: Install host and ARM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3 python3-pil python3-venv libegl1 libgl1 fonts-dejavu-core
          arm-none-eabi-gcc --version
      - name: Install pinned headless desktop runtime
        working-directory: candidate
        run: |
          python3 -m venv --system-site-packages .workbench-env
          .workbench-env/bin/python -m pip install -r Firmware/tools/requirements-workbench.txt
      - name: Hardware source/export and review reconciliation
        working-directory: candidate
        run: |
          python3 PCB/tools/audit_rev1.py --check
          python3 -m unittest discover -s PCB/tests -v
      - name: Host and Python regression
        working-directory: candidate/Firmware
        run: |
          for preset in host-debug host-release; do
            for curves in OFF ON; do
              for factory in OFF ON; do
                build="build/$preset-curves-$curves-factory-$factory"
                cmake --preset "$preset" -G Ninja -B "$build" -DWTK_ENABLE_SUPPLEMENTARY_CURVES="$curves" -DWTK_PRODUCT_FACTORY_PROVISIONED="$factory"
                cmake --build "$build" --parallel 2
                ctest --test-dir "$build" --output-on-failure
                QT_QPA_PLATFORM=offscreen WTK_CAPTURE_BRIDGE="$PWD/$build/tests/wtk_pc_cal_capture_bridge" ../.workbench-env/bin/python -m unittest discover -s tests/tools -v
              done
            done
          done
      - name: Build and capture the generic baseline
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import json; assert any(p["name"]=="stm32-unit-release" for p in json.load(open("baseline/Firmware/CMakePresets.json"))["configurePresets"])'; then
            presets="stm32-unit-release stm32-bringup stm32-bringup-cal"
          else
            presets="stm32-debug stm32-release stm32-bringup"
          fi
          for preset in $presets; do
            cmake --preset "$preset" -S baseline/Firmware -DWTK_FLASH_FORENSICS=ON
            cmake --build "baseline/Firmware/build/$preset" --parallel 2 2>&1 | tee "baseline/Firmware/build/$preset-build.log"
            python3 candidate/Firmware/tools/collect_flash_evidence.py "baseline/Firmware/build/$preset" \
              --profile "$preset-base" --git-sha "$(git -C baseline rev-parse HEAD)"
          done
      - name: Build current production and recovery contracts
        working-directory: candidate/Firmware
        run: python3 tools/product_factory_matrix.py --out build/ci-profiles
      - name: Capture the current profile matrix
        working-directory: candidate/Firmware
        shell: bash
        run: |
          set -euo pipefail
          for profile in unit-release unit-debug unit-no-serial bringup bringup-cal bringup-k1 bringup-bench bringup-peripheral; do
            python3 tools/collect_flash_evidence.py "build/ci-profiles/$profile" \
              --profile "$profile" --git-sha "$(git rev-parse HEAD)"
          done
      - name: Build optional curves within the explicit unit memory contract
        working-directory: candidate/Firmware
        run: |
          for kind in Debug Release; do
            build="build/unit-curves-$kind"
            cmake --preset stm32-unit-release -B "$build" \
              -DCMAKE_BUILD_TYPE="$kind" -DWTK_ENABLE_SUPPLEMENTARY_CURVES=ON -DWTK_FLASH_FORENSICS=ON
            cmake --build "$build" --parallel 2
            python3 tools/collect_flash_evidence.py "$build" \
              --profile "unit-curves-$kind" --git-sha "$(git rev-parse HEAD)"
          done
      - name: Build bounded calibration recovery with optional curves
        working-directory: candidate/Firmware
        run: |
          cmake --preset stm32-bringup-cal -B build/recovery-curves-on \
            -DWTK_ENABLE_SUPPLEMENTARY_CURVES=ON -DWTK_FLASH_FORENSICS=ON
          cmake --build build/recovery-curves-on --parallel 2
          python3 tools/collect_flash_evidence.py build/recovery-curves-on \
            --profile recovery-curves-on --git-sha "$(git rev-parse HEAD)"
      - name: Retain evidence even on a build-gate failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-forensics-${{ github.sha }}
          retention-days: 30
          path: |
            baseline/Firmware/build/**/forensics/
            candidate/Firmware/build/**/forensics/
            baseline/Firmware/build/**/*.map
            candidate/Firmware/build/**/*.map
            baseline/Firmware/build/**/*.size.json
            candidate/Firmware/build/**/*.size.json
            baseline/Firmware/build/**/*.elf
            candidate/Firmware/build/**/*.elf
            baseline/Firmware/build/**/*.bin
            candidate/Firmware/build/**/*.bin
            candidate/Firmware/build/**/*.su
            candidate/Firmware/build/*-build.log
            baseline/Firmware/build/*-build.log
            candidate/Firmware/build/ci-profiles/*.json
            candidate/Firmware/build/ci-profiles/*.log
